<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {%-seo title=false-%}
  {%-feed_meta-%}

  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}" />
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.css" integrity="sha384-OH8qNTHoMMVNVcKdKewlipV4SErXqccxxlg6HC9Cwjr5oZu2AdBej1TndeCirael" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />

<style>
.gallery-hero {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  margin: 2em 0;
  height: 500px;
}

.gallery-hero a {
  display: block;
  overflow: hidden;
  border-radius: 6px;
}

/* Big image: spans all 3 rows in column 1 */
.gallery-hero a:nth-child(1) {
  grid-column: 1;
  grid-row: 1 / 4;
}

/* Thumbnails: column 2, one row each */
.gallery-hero a:nth-child(2) { grid-column: 2; grid-row: 1; }
.gallery-hero a:nth-child(3) { grid-column: 2; grid-row: 2; }
.gallery-hero a:nth-child(4) { grid-column: 2; grid-row: 3; }

.gallery-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
</head>
