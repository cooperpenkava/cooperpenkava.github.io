<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
  <script>
  const lightbox = GLightbox({
    selector: '.glightbox'
  });
  </script>
  <script>
  .gallery-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 2em 0;
}
.gallery-hero .hero-main {
  grid-row: span 3; /* Makes the first image span the full height */
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.gallery-hero .thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
  </script>
  </body>
</html>
